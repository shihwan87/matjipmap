{
    "extractor": {
        "instagram": {
            "directory": ["{post_shortcode}"],
            "filename": "{num:>02}.{extension}",
            "sleep-request": [2.0, 5.0],
            "postprocessors": [
                { "name": "metadata", "mode": "json" }
            ]
        }
    },
    "downloader": { "http": { "retries": 3, "timeout": 30 } },
    "output": { "mode": "auto", "progress": true }
}
